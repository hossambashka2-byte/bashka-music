name: Build BASHKA AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Extract PWA
        run: |
          unzip -o "BASHKA_V_STORE_PLAY_READY.zip" -d pwa || unzip -o *.zip -d pwa || true
          ls pwa
      - name: Setup Android Project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/assets/www app/src/main/java/com/bashka/music
          cp -r pwa/* app/src/main/assets/www/ 2>/dev/null || cp -r pwa/BASHKA*/* app/src/main/assets/www/ || true
          ls app/src/main/assets/www/
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          cat > app/src/main/java/com/bashka/music/MainActivity.java <<'EOF'
          package com.bashka.music;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            WebView w;
            protected void onCreate(Bundle b){ super.onCreate(b); w=new WebView(this); setContentView(w); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); w.loadUrl("file:///android_asset/www/index.html"); }
            public void onBackPressed(){ if(w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bashka.music">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="BASHKA MUSIC"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.bashka.music'; compileSdk 34; defaultConfig { applicationId "com.bashka.music"; minSdk 21; targetSdk 34; versionCode 3; versionName "3.0" }; buildTypes { release { minifyEnabled false } } }
          EOF
      - name: Build AAB
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip && unzip -q gradle.zip && ./gradle-8.4/bin/gradle bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BASHKA-AAB
          path: app/build/outputs/bundle/release/*.aab
